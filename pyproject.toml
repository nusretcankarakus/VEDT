[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disktest86"
version = "0.6.0.dev0"
description = "VEDT - Vektron Elektronik Disk Test"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["reportlab>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
vmtest = ["pyfatfs==1.1.0", "setuptools>=68,<81", "pycdlib>=1.22,<2"]

[project.scripts]
disktest = "disktest.cli:main"

[tool.setuptools.packages.find]
include = ["disktest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
disktest = ["assets/*.png"]
